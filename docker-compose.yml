# ============================================================
# IPTV 采集工具 Docker Compose 配置
# 首次运行请先执行 bash init.sh
# ============================================================

# 公共配置：数据卷、环境变量、重启策略、网络、资源限制、日志轮转
x-iptv-volumes: &iptv-volumes
  - ./config.yaml:/app/config.yaml
  - ./data:/app/data
  - ./output:/app/output
  - ./log:/app/log

x-iptv-env: &iptv-env
  TZ: Asia/Shanghai
  ICON_HOST: ${ICON_HOST:-http://your-server:6060}   # 播放器可达的图标地址
  EPG_URL: ${EPG_URL:-}                              # M3U 头部 x-tvg-url

x-iptv-common: &iptv-common
  restart: unless-stopped
  networks: [iptv-net]
  deploy:
    resources:
      limits:
        cpus: "2"
        memory: 1G

x-iptv-logging: &iptv-logging
  driver: json-file
  options: {max-size: "10m", max-file: "3"}

services:
  # ---------- Web 服务（默认端口 6060） ----------
  iptv-web:
    build: .
    image: iptv:latest
    container_name: iptv-web
    <<: *iptv-common
    ports:
      - "${WEB_PORT:-6060}:6060"                     # 端口可用 .env 的 WEB_PORT 修改
    volumes: *iptv-volumes
    environment:
      <<: *iptv-env
      WEB_AUTH: ${WEB_AUTH:-}                        # 外网访问鉴权 user:password（可选）
    # 健康检查：Web 就绪后 scheduler 才启动
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:6060/healthz',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging: *iptv-logging

  # ---------- 定时采集（可选，与 Web 共用一个镜像） ----------
  iptv-scheduler:
    image: iptv:latest
    container_name: iptv-scheduler
    <<: *iptv-common
    volumes: *iptv-volumes
    environment: *iptv-env
    depends_on:
      iptv-web:
        condition: service_healthy                    # 等待 Web 健康检查通过
    healthcheck: {disable: true}                       # scheduler 无 Web 服务
    command: ["python", "scheduler.py"]
    logging: *iptv-logging

networks:
  iptv-net:
    driver: bridge