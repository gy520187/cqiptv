{% extends "base.html" %}
{% block title %}总览{% endblock %}
{% block content %}
<h1>总览</h1>
<div class="cards">
    <div class="card">
        <div class="card-label">频道总数</div>
        <div class="card-value" id="stat-channels">-</div>
    </div>
    <div class="card">
        <div class="card-label">EPG 频道</div>
        <div class="card-value" id="stat-epg">-</div>
    </div>
    <div class="card">
        <div class="card-label">解密密钥</div>
        <div class="card-value small" id="stat-key">-</div>
    </div>
</div>
<h2>数据文件</h2>
<table class="table">
    <thead><tr><th>文件</th><th>大小</th><th>更新时间</th><th>操作</th></tr></thead>
    <tbody id="file-tbody"></tbody>
</table>
<h2>数据源地址</h2>
<div class="urls">
    <div><strong>M3U：</strong><code id="url-m3u"></code></div>
    <div><strong>EPG：</strong><code id="url-epg"></code></div>
    <div><strong>EPG (gz)：</strong><code id="url-epg-gz"></code></div>
</div>
{% endblock %}

{% block script %}
<script>
async function loadStatus() {
    const r = await fetch('/api/status');
    const d = await r.json();
    document.getElementById('stat-channels').textContent = d.channels;
    document.getElementById('stat-epg').textContent = d.epg_channels;
    document.getElementById('stat-key').textContent = d.key;
    const tbody = document.getElementById('file-tbody');
    tbody.innerHTML = '';
    d.files.forEach(f => {
        const tr = document.createElement('tr');
        tr.innerHTML = `<td>${f.name}</td><td>${fmtSize(f.size)}</td>
            <td>${fmtTime(f.mtime)}</td>
            <td><a href="/api/download/${f.name}">下载</a></td>`;
        tbody.appendChild(tr);
    });
    const host = location.origin;
    document.getElementById('url-m3u').textContent = host + '/playlist.m3u';
    document.getElementById('url-epg').textContent = host + '/epg.xml';
    document.getElementById('url-epg-gz').textContent = host + '/epg.xml.gz';
}
loadStatus();
setInterval(loadStatus, 5000);
</script>
{% endblock %}
