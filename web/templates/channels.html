{% extends "base.html" %}
{% block title %}频道{% endblock %}
{% block content %}
<h1>频道列表</h1>
<div class="toolbar">
    <input id="kw" placeholder="搜索频道名..." onkeyup="if(event.key==='Enter')loadChannels(1)">
    <button onclick="loadChannels(1)">搜索</button>
</div>
<table class="table">
    <thead><tr><th>台号</th><th>频道名</th><th>栏目</th>
        <th>时移</th><th>回看</th><th>已订</th><th>mediacode</th></tr></thead>
    <tbody id="ch-tbody"></tbody>
</table>
<div class="pagination" id="pager"></div>
{% endblock %}

{% block script %}
<script>
let curPage = 1;
async function loadChannels(page) {
    curPage = page;
    const kw = document.getElementById('kw').value;
    const r = await fetch(`/api/channels?page=${page}&size=50&keyword=${encodeURIComponent(kw)}`);
    const d = await r.json();
    const tbody = document.getElementById('ch-tbody');
    tbody.innerHTML = '';
    d.items.forEach(c => {
        const tr = document.createElement('tr');
        tr.innerHTML = `<td>${c.channelIndex}</td><td>${c.channelName}</td>
            <td>${c.category || ''}</td>
            <td>${c.timeShift ? '✅' : '❌'}</td>
            <td>${c.isTVOD ? '✅' : '❌'}</td>
            <td>${c.hasSubscrib ? '✅' : '❌'}</td>
            <td><code>${c.mediacode || ''}</code></td>`;
        tbody.appendChild(tr);
    });
    renderPager(d.total, d.page, d.size);
}
function renderPager(total, page, size) {
    const pages = Math.ceil(total / size);
    const pager = document.getElementById('pager');
    pager.innerHTML = `共 ${total} 条，${pages} 页 `;
    for (let i = 1; i <= Math.min(pages, 20); i++) {
        const b = document.createElement('button');
        b.textContent = i;
        b.className = i === page ? 'active' : '';
        b.onclick = () => loadChannels(i);
        pager.appendChild(b);
    }
}
loadChannels(1);
</script>
{% endblock %}
