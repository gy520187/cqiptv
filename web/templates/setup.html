{% extends "base.html" %}
{% block title %}初始化配置{% endblock %}
{% block content %}
<h1>⚙️ 初始化配置</h1>
<p class="hint">填写机顶盒和账户信息，其余配置已内置。</p>

<form id="setup-form" class="setup-form">
    <fieldset>
        <legend>认证服务器</legend>
        <div class="field">
            <label>AuthenticationIP <span class="req">*</span></label>
            <input name="AuthenticationIP" placeholder="http://172.23.88.159:33200/EPG/jsp" required>
        </div>
    </fieldset>
    <fieldset>
        <legend>账户</legend>
        <div class="field">
            <label>UserID <span class="req">*</span></label>
            <input name="UserID" placeholder="i5207379189@itv" required>
        </div>
    </fieldset>
    <fieldset>
        <legend>机顶盒</legend>
        <div class="field">
            <label>mac <span class="req">*</span></label>
            <input name="mac" placeholder="28:A6:DB:6F:D2:9E" required>
        </div>
        <div class="field">
            <label>STBID <span class="req">*</span></label>
            <input name="STBID" placeholder="0010049900608930173628A6DB6FD29E" required>
        </div>
        <div class="field">
            <label>STBType <span class="req">*</span></label>
            <input name="STBType" placeholder="EC6108V9U_pub_cqydx" required>
        </div>
        <div class="field">
            <label>STBVersion</label>
            <input name="STBVersion" placeholder="HWV215011P0000">
        </div>
    </fieldset>
    <fieldset>
        <legend>认证（可选）</legend>
        <div class="field">
            <label>Authenticator</label>
            <textarea name="Authenticator" rows="3" placeholder="从机顶盒抓包获取"></textarea>
        </div>
        <div class="field">
            <label>key（破解后自动回写）</label>
            <input name="key" readonly>
        </div>
    </fieldset>
    <div class="actions">
        <button type="submit" class="btn-primary">保存并开始</button>
    </div>
</form>
{% endblock %}

{% block script %}
<script>
document.getElementById('setup-form').onsubmit = async (e) => {
    e.preventDefault();
    const data = {};
    e.target.querySelectorAll('input, textarea').forEach(el => {
        if (el.name && el.value.trim()) data[el.name] = el.value.trim();
    });
    const r = await fetch('/api/config/save', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(data),
    });
    const d = await r.json();
    if (d.ok) {
        toast('保存成功');
        setTimeout(() => location.href = '/', 800);
    } else {
        toast('保存失败: ' + d.msg);
    }
};
</script>
{% endblock %}
