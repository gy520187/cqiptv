<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}IPTV 管理{% endblock %}</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div id="collect-wrap">
    <span id="collect-msg">采集中...</span>
    <div id="collect-bar-wrap"><div id="collect-bar"></div></div>
</div>
<nav class="navbar">
    <div class="brand">IPTV 管理</div>
    <ul class="menu">
        <li><a href="/" class="{{ 'active' if request.path == '/' }}">总览</a></li>
        <li><a href="/channels" class="{{ 'active' if request.path == '/channels' }}">频道</a></li>
        <li><a href="/epg" class="{{ 'active' if request.path == '/epg' }}">EPG</a></li>
        <li><a href="/crack" class="{{ 'active' if request.path == '/crack' }}">密钥</a></li>
        <li><a href="/config" class="{{ 'active' if request.path == '/config' }}">配置</a></li>
        <li><a href="/logs" class="{{ 'active' if request.path == '/logs' }}">日志</a></li>
    </ul>
    <div class="actions">
        <button class="btn btn-primary" onclick="startCollect()">采集</button>
    </div>
</nav>
<main class="container">
    {% block content %}{% endblock %}
</main>
<div id="toast" class="toast"></div>
<script src="/static/app.js"></script>
{% block script %}{% endblock %}
</body>
</html>
