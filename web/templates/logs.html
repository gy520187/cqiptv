{% extends "base.html" %}
{% block title %}日志{% endblock %}
{% block content %}
<h1>日志</h1>
<div class="toolbar">
    <input id="lines" type="number" value="200">
    <button onclick="loadLogs()">刷新</button>
</div>
<pre id="log-content" class="log-content"></pre>
{% endblock %}

{% block script %}
<script>
async function loadLogs() {
    const lines = document.getElementById('lines').value;
    const r = await fetch('/api/logs?lines=' + lines);
    const d = await r.json();
    document.getElementById('log-content').textContent = d.join('\n');
}
loadLogs();
setInterval(loadLogs, 5000);
</script>
{% endblock %}
