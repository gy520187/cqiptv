{% extends "base.html" %}
{% block title %}定时任务{% endblock %}
{% block content %}
<h1>定时任务配置</h1>
<div class="card sched-card">
    <p class="form-tip">可配置多个采集任务，任一 cron 到点即触发一次采集。格式：<code>分 时 日 月 周</code>，如 <code>0 4 * * *</code> 每天 04:00、<code>*/30 * * * *</code> 每 30 分钟。</p>
    <div class="sched-jobs">
        <div class="sched-head">
            <span>启用</span><span>cron 表达式</span><span>下次运行时间</span><span></span>
        </div>
        <div id="job-list"></div>
    </div>
    <div class="toolbar" style="margin-bottom:0">
        <button class="btn btn-default" onclick="addJob()">添加任务</button>
        <button class="btn btn-primary" onclick="saveJobs()">保存全部</button>
        <button class="btn btn-default" onclick="loadJobs()">刷新</button>
    </div>
    <p class="form-tip">保存配置后 scheduler 会自动重新加载，无需重启容器。</p>
</div>
{% endblock %}

{% block script %}
<script>
let DEFAULT_CRON = '0 4 * * *';
const jobList = document.getElementById('job-list');
async function loadJobs() {
    const r = await fetch('/api/scheduler/config');
    const d = await r.json();
    DEFAULT_CRON = d.default_cron || DEFAULT_CRON;
    jobList.innerHTML = '';
    if (!d.jobs || !d.jobs.length) addJob();
    (d.jobs || []).forEach(j => renderRow(j));
}
function renderRow(job) {
    const row = document.createElement('div');
    row.className = 'sched-row';
    row.innerHTML = `
        <label class="sched-enable">
            <input type="checkbox" ${job.enabled ? 'checked' : ''}>
        </label>
        <input class="sched-cron" type="text" value="${(job.cron || DEFAULT_CRON).replace(/"/g, '&quot;')}" placeholder="${DEFAULT_CRON}">
        <span class="sched-next">${job.next_run || '-'}</span>
        <button class="btn btn-danger btn-sm" onclick="this.closest('.sched-row').remove()">删除</button>`;
    jobList.appendChild(row);
}
function addJob() {
    renderRow({enabled: true, cron: DEFAULT_CRON, next_run: null});
}
async function saveJobs() {
    const rows = [...document.querySelectorAll('#job-list .sched-row')];
    const jobs = rows.map(row => ({
        enabled: row.querySelector('.sched-enable input').checked,
        cron: row.querySelector('.sched-cron').value.trim(),
    }));
    const r = await fetch('/api/scheduler/config', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({jobs}),
    });
    const d = await r.json();
    if (d.ok) {
        toast('已保存');
        loadJobs();
    } else {
        toast(d.msg || '保存失败');
    }
}
loadJobs();
</script>
{% endblock %}
